<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Signage Player</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: Arial, sans-serif; }
    
    /* PAIRING SCREEN */
    #pairing-screen {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      z-index: 100;
    }
    #pairing-screen.hidden { display: none; }
    .pairing-title { color: #fff; font-size: 2rem; margin-bottom: 1rem; text-transform: uppercase; letter-spacing: 4px; }
    .pairing-code { color: #00ff88; font-size: 8rem; font-weight: bold; letter-spacing: 20px; text-shadow: 0 0 40px rgba(0, 255, 136, 0.5); }
    .pairing-subtitle { color: #888; font-size: 1.2rem; margin-top: 2rem; }
    
    /* PLAYER SCREEN */
    #player-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; display: none; }
    #player-screen.active { display: block; }
    #media-container { width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; }
    #media-container img, #media-container video { max-width: 100%; max-height: 100%; object-fit: contain; }
    
    /* OFFLINE INDICATOR */
    #offline-indicator {
      position: fixed; top: 20px; right: 20px;
      background: rgba(255, 0, 0, 0.8); color: white;
      padding: 10px 20px; border-radius: 5px; font-size: 14px; display: none; z-index: 50;
    }
    #offline-indicator.visible { display: block; }

    /* PORTRAIT ORIENTATION - rotate the fullscreen content 90deg to fit a
       portrait-mounted display while the OS/browser still renders landscape */
    body.orientation-portrait #pairing-screen,
    body.orientation-portrait #player-screen {
      width: 100vh;
      height: 100vw;
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) rotate(90deg);
    }
  </style>
</head>
<body>
  <!-- PAIRING SCREEN -->
  <div id="pairing-screen">
    <div class="pairing-title">Pairing Code</div>
    <div class="pairing-code" id="pairing-code-display">------</div>
    <div class="pairing-subtitle">Enter this code in the admin dashboard</div>
  </div>

  <!-- PLAYER SCREEN -->
  <div id="player-screen">
    <div id="media-container"></div>
  </div>

  <!-- OFFLINE INDICATOR -->
  <div id="offline-indicator">OFFLINE - Playing cached content</div>

  <script>
    // ==================== CONFIG ====================
    // Same-origin: the server serves this HTML file, so protocol+host already match the API.
    const getApiBase = () => `${window.location.protocol}//${window.location.host}/api/signage`;

    const API_BASE = getApiBase();
    
    console.log('API Base URL:', API_BASE);
    
    const POLL_INTERVAL = 30000; // 30 seconds - default/fallback, server can override per poll
    const CACHE_KEY = 'signage_cache';
    const DEVICE_ID_KEY = 'signage_device_id';
    const REFRESH_KEY = 'signage_refreshed_at';
    const OFFLINE_THRESHOLD = 3; // Show offline after 3 consecutive failures
    
    // ==================== STATE ====================
    let deviceId = null;
    let currentPlaylist = [];
    let currentIndex = 0;
    let isPlaying = false;
    let pollTimer = null;
    let mediaTimer = null;
    let isOnline = true;
    let consecutiveFailures = 0;

    // ==================== INIT ====================
    async function init() {
      deviceId = localStorage.getItem(DEVICE_ID_KEY);
      
      // First, check if device is already paired by polling
      if (deviceId) {
        await pollBackend();
      } else {
        // No deviceId, register new device
        await registerDevice();
      }
      startPolling();
    }
    
    // ==================== DEVICE REGISTRATION ====================
    async function registerDevice() {
      try {
        const response = await fetch(`${API_BASE}/tv/register`, { method: 'GET' });
        const data = await response.json();
        if (data.success && data.data) {
          // Store both deviceId and pairing code
          deviceId = data.data.deviceId;
          localStorage.setItem(DEVICE_ID_KEY, deviceId);
          
          // If we have a code, show pairing screen
          if (data.data.code) {
            showPairingScreen(data.data.code);
          } else {
            // Already paired, start polling
            startPolling();
          }
        } else {
          setTimeout(registerDevice, 5000);
        }
      } catch (error) {
        console.error('Registration error:', error);
        setTimeout(registerDevice, 5000);
      }
    }
    
    // ==================== PAIRING SCREEN ====================
    function showPairingScreen(code) {
      document.getElementById('pairing-screen').classList.remove('hidden');
      document.getElementById('player-screen').classList.remove('active');
      document.getElementById('pairing-code-display').textContent = code;
    }
    
    // ==================== POLLING ====================
    function startPolling() {
      scheduleNextPoll(POLL_INTERVAL);
    }

    function scheduleNextPoll(delayMs) {
      if (pollTimer) clearTimeout(pollTimer);
      pollTimer = setTimeout(pollBackend, delayMs);
    }

    function applyOrientation(orientation) {
      document.body.classList.toggle('orientation-portrait', orientation === 'portrait');
    }

    // If the admin triggered a manual "Force Refresh", reload the page so
    // it picks up fresh assets/code rather than just re-fetching the playlist.
    function checkForcedRefresh(refreshedAt) {
      if (!refreshedAt) return false;
      const lastSeen = localStorage.getItem(REFRESH_KEY);
      if (lastSeen && lastSeen === refreshedAt) return false;
      localStorage.setItem(REFRESH_KEY, refreshedAt);
      if (lastSeen) {
        // Only reload if this isn't the very first time we've seen a refresh marker
        window.location.reload();
        return true;
      }
      return false;
    }

    async function pollBackend() {
      if (!deviceId) return;

      let nextDelay = POLL_INTERVAL;
      try {
        const response = await fetch(`${API_BASE}/tv/poll`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ deviceId: deviceId, mediaHashes: {} })
        });

        const data = await response.json();

        // Reset failure counter on successful response
        consecutiveFailures = 0;

        // Handle API response - check both success flag and nested data
        const pollData = data.success ? (data.data || data) : data;

        if (!data.success) {
          if (pollData.message === 'DEVICE_NOT_FOUND' || pollData.message === 'NOT_PAIRED') {
            // Device not found or not paired - clear localStorage and re-register
            localStorage.removeItem(DEVICE_ID_KEY);
            localStorage.removeItem(CACHE_KEY);
            deviceId = null;
            // Show pairing screen
            document.getElementById('pairing-screen').classList.remove('hidden');
            document.getElementById('player-screen').classList.remove('active');
            await registerDevice();
            return;
          }
          // Other error - try again later
          console.error('Poll error:', pollData.message);
          return;
        }

        setOnline(true);

        if (checkForcedRefresh(pollData.refreshedAt)) return;

        // Check if device is paired - this is the key check for existing deviceId
        if (pollData.paired === false) {
          // Device is registered but not paired - show pairing screen with code
          document.getElementById('pairing-screen').classList.remove('hidden');
          document.getElementById('player-screen').classList.remove('active');
          if (pollData.code) {
            showPairingScreen(pollData.code);
          }
          return;
        }

        applyOrientation(pollData.device?.orientation);

        // Device is paired - hide pairing screen and show player
        document.getElementById('pairing-screen').classList.add('hidden');

        // Device is paired and has playlist
        if (pollData.playlist && pollData.playlist.items && pollData.playlist.items.length > 0) {
          // Pre-cache media files
          preCacheMedia(pollData.playlist.items);

          currentPlaylist = pollData.playlist.items;
          currentIndex = 0;
          cachePlaylist(pollData.playlist);
          if (!isPlaying) startPlayback();
        } else {
          // Paired but no playlist assigned - show message
          document.getElementById('player-screen').classList.add('active');
          document.getElementById('media-container').innerHTML = '<div style="color: #888; text-align: center;">No playlist assigned<br>Please assign a playlist in admin dashboard</div>';
        }

        // Follow the server-calculated cadence (playlist cycle length, capped 30s-5min)
        if (pollData.refreshInterval) nextDelay = pollData.refreshInterval;

      } catch (error) {
        console.error('Poll network error:', error);
        consecutiveFailures++;
        if (consecutiveFailures >= OFFLINE_THRESHOLD) {
          setOnline(false);
        }
      } finally {
        scheduleNextPoll(nextDelay);
      }
    }
    
    // ==================== CACHE ====================
    function getCache() {
      try { return JSON.parse(localStorage.getItem(CACHE_KEY)) || { playlist: null }; }
      catch { return { playlist: null }; }
    }
    
    function saveCache(cache) {
      localStorage.setItem(CACHE_KEY, JSON.stringify(cache));
    }
    
    function cachePlaylist(playlist) {
      const cache = getCache();
      cache.playlist = playlist;
      cache.lastUpdated = new Date().toISOString();
      saveCache(cache);
    }
    
    // ==================== MEDIA CACHE ====================
    // Real offline storage: actual image/video bytes are fetched once and kept as a
    // Blob in IndexedDB (not just a re-reference to the same network URL, which is
    // what silently never provided any offline capability before, and only ever
    // touched images — video was never pre-cached at all). IndexedDB (not the Cache
    // API/Service Worker) because a Service Worker requires HTTPS except on
    // localhost, and this player is typically reached over a plain-HTTP LAN address.
    const MEDIA_DB_NAME = 'signage_media_store';
    const MEDIA_STORE = 'media';
    let mediaDbPromise = null;
    let currentObjectUrl = null; // revoked before the next one is created, to avoid leaking memory over long uptimes

    function openMediaDB() {
      if (mediaDbPromise) return mediaDbPromise;
      mediaDbPromise = new Promise((resolve, reject) => {
        const req = indexedDB.open(MEDIA_DB_NAME, 1);
        req.onupgradeneeded = () => {
          req.result.createObjectStore(MEDIA_STORE, { keyPath: 'mediaId' });
        };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
      return mediaDbPromise;
    }

    async function getCachedEntry(mediaId) {
      try {
        const db = await openMediaDB();
        return await new Promise((resolve, reject) => {
          const tx = db.transaction(MEDIA_STORE, 'readonly');
          const req = tx.objectStore(MEDIA_STORE).get(mediaId);
          req.onsuccess = () => resolve(req.result || null);
          req.onerror = () => reject(req.error);
        });
      } catch (e) {
        return null;
      }
    }

    async function putCachedEntry(mediaId, blob, hash) {
      const db = await openMediaDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(MEDIA_STORE, 'readwrite');
        tx.objectStore(MEDIA_STORE).put({ mediaId, blob, hash, cachedAt: new Date().toISOString() });
        tx.oncomplete = () => resolve();
        tx.onerror = () => reject(tx.error);
      });
    }

    async function deleteCachedEntry(mediaId) {
      try {
        const db = await openMediaDB();
        await new Promise((resolve) => {
          const tx = db.transaction(MEDIA_STORE, 'readwrite');
          tx.objectStore(MEDIA_STORE).delete(mediaId);
          tx.oncomplete = resolve;
          tx.onerror = resolve;
        });
      } catch (e) { /* best-effort */ }
    }

    function resolveMediaUrl(item) {
      let mediaUrl = item.media.fileUrl || '';
      if (!mediaUrl.startsWith('http')) {
        mediaUrl = API_BASE.replace('/api/signage', '') + mediaUrl;
      }
      return mediaUrl;
    }

    async function preCacheMedia(items) {
      for (const item of items) {
        if (!item.media) continue;
        try {
          const existing = await getCachedEntry(item.media._id);
          // Re-fetch if never cached, or if the file changed since (hash mismatch)
          if (existing && existing.hash === item.media.hash) continue;

          const response = await fetch(resolveMediaUrl(item));
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          const blob = await response.blob();
          await putCachedEntry(item.media._id, blob, item.media.hash);
          console.log('Pre-cached (offline-ready):', item.media.fileName);
        } catch (e) {
          console.log('Failed to cache:', item.media.fileName, e.message);
        }
      }
    }

    // Returns a local blob: URL for offline playback, or null if not cached yet —
    // callers fall back to the live network URL in that case.
    async function getCachedMediaObjectUrl(mediaId) {
      const entry = await getCachedEntry(mediaId);
      if (!entry) return null;
      if (currentObjectUrl) URL.revokeObjectURL(currentObjectUrl);
      currentObjectUrl = URL.createObjectURL(entry.blob);
      return currentObjectUrl;
    }
    
    // ==================== PLAYBACK ====================
    function startPlayback() {
      if (currentPlaylist.length === 0) {
        const cache = getCache();
        if (cache.playlist && cache.playlist.items) currentPlaylist = cache.playlist.items;
      }
      
      if (currentPlaylist.length === 0) {
        setTimeout(startPlayback, 2000);
        return;
      }
      
      isPlaying = true;
      document.getElementById('pairing-screen').classList.add('hidden');
      document.getElementById('player-screen').classList.add('active');
      playCurrentItem();
    }
    
    async function playCurrentItem() {
      if (!isPlaying || currentPlaylist.length === 0) return;

      const item = currentPlaylist[currentIndex];
      if (!item || !item.media) {
        console.log('No item or media found, skipping');
        nextItem();
        return;
      }

      const container = document.getElementById('media-container');
      container.innerHTML = '';

      // A device navigating between items while offline can't await network — freeze
      // it back on this same item rather than plow ahead onto a media element that
      // has no chance of loading either.
      const playToken = ++playCurrentItem._token;

      // Real offline-first playback: use a locally stored blob if we have one, only
      // touching the network if nothing's cached yet.
      const mediaId = item.media._id;
      let mediaUrl = await getCachedMediaObjectUrl(mediaId);
      const usingCache = !!mediaUrl;
      if (!mediaUrl) mediaUrl = resolveMediaUrl(item);

      if (playToken !== playCurrentItem._token) return; // superseded while we were awaiting the cache lookup

      console.log('Loading media:', mediaUrl, usingCache ? '(from offline cache)' : '(live network)');

      const duration = item.duration || 10;

      // Rotation set per-media in the admin dashboard — kept in sync with the preview
      // shown there (a plain CSS rotate, not a full portrait/landscape re-fit).
      const rotation = item.media.rotation || 0;

      // Shared fallback: a cached blob can be corrupt/partial; if it fails, drop it
      // and retry once against the live network URL before giving up.
      const handleLoadError = (el, isVideo) => {
        if (usingCache) {
          console.warn('Cached media failed to load, dropping cache entry and retrying live:', item.media.fileName);
          deleteCachedEntry(mediaId);
          el.src = resolveMediaUrl(item);
          el.onerror = () => showLoadFailure(item.media.fileName);
        } else {
          showLoadFailure(item.media.fileName);
        }
      };

      const showLoadFailure = (fileName) => {
        container.innerHTML = `<div style="color: red; text-align: center;">Failed to load: ${fileName}</div>`;
        setTimeout(() => nextItem(), 2000);
      };

      if (item.media.type === 'video') {
        const video = document.createElement('video');
        video.src = mediaUrl;
        video.style.transform = `rotate(${rotation}deg)`;
        video.autoplay = true;
        video.muted = true;
        video.loop = false;
        video.onended = () => nextItem();
        video.onerror = () => handleLoadError(video, true);
        container.appendChild(video);
      } else {
        const img = document.createElement('img');
        img.src = mediaUrl;
        img.style.maxWidth = '100%';
        img.style.maxHeight = '100%';
        img.style.objectFit = 'contain';
        img.style.transform = `rotate(${rotation}deg)`;
        img.onerror = () => handleLoadError(img, false);
        container.appendChild(img);
        mediaTimer = setTimeout(() => nextItem(), duration * 1000);
      }
    }
    playCurrentItem._token = 0;
    
    function nextItem() {
      if (mediaTimer) { clearTimeout(mediaTimer); mediaTimer = null; }
      currentIndex++;
      if (currentIndex >= currentPlaylist.length) currentIndex = 0;
      playCurrentItem();
    }
    
    // ==================== NETWORK STATUS ====================
    function setOnline(online) {
      isOnline = online;
      document.getElementById('offline-indicator').classList.toggle('visible', !online);
    }
    
    // ==================== START ====================
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', init);
    } else {
      init();
    }
  </script>
</body>
</html>
